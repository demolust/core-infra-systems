---
- name: Set base envs
  ansible.builtin.set_fact:
    rustup_sh_url: "https://sh.rustup.rs"

- name: Clone dotfiles repository
  ansible.builtin.git:
    repo: "{{ dotfiles_repo }}"
    dest: "{{ admin_home_dir }}/dotfiles"
    version: main

- name: Ensure required user directories exist
  ansible.builtin.file:
    path: "{{ item }}"
    state: directory
    mode: '0755'
  loop:
    - "{{ admin_home_dir }}/.config/systemd/user/"
    - "{{ admin_home_dir }}/.local/share/cargo/bin"
    - "{{ admin_home_dir }}/.local/share/go/bin"
    - "{{ admin_home_dir }}/.local/installs"

- name: Sync dotfiles from repo
  ansible.posix.synchronize:
    src: "{{ admin_home_dir }}/dotfiles/{{ item.src }}"
    dest: "{{ admin_home_dir }}/{{ item.dest }}"
  delegate_to: "{{ inventory_hostname }}"
  loop:
    - { src: '.config/', dest: '.config/' }
    - { src: '.local/',  dest: '.local/' }
    - { src: '.zshrc',    dest: '.zshrc' }
    - { src: '.zshenv',    dest: '.zshenv' }

- name: Trigger Zsh setup
  ansible.builtin.shell: |
    source ~/.zshenv
    source ~/.zshrc
    # Produce some output after first run
    echo 'Zsh Setup Done'
  args:
    executable: /bin/zsh
    chdir: "{{ admin_home_dir }}"
  register: zsh_setup_output

- debug:
    var: zsh_setup_output.stdout_lines

- name: Download rustup script
  ansible.builtin.get_url:
    url: "{{ rustup_sh_url }}"
    dest: "/tmp/rustup.sh"
    mode: '0755'

- name: Run rustup.sh with non-interactive flag
  ansible.builtin.shell: |
    source ~/.zshenv
    source ~/.zshrc
    /tmp/rustup.sh -y
  args:
    executable: /bin/zsh
    chdir: "{{ admin_home_dir }}"

- name: Update rust to the latest version
  ansible.builtin.shell: |
    source ~/.zshenv
    source ~/.zshrc
    rustup default stable
    rustup update
  args:
    executable: /bin/zsh
    chdir: "{{ admin_home_dir }}"

- name: Create the server settings file
  ansible.builtin.copy:
    dest: ~/.local/share/zsh/01-server_settings.zsh
    content: |
      typeset -U path PATH
      path=(~/.local/installs/go/bin $path)
      export PATH
    mode: '0644'

- name: Install latest go
  ansible.builtin.shell: |
    source ~/.zshenv
    source ~/.zshrc
    {{ admin_home_dir }}/dotfiles/scripts/install_go.sh
  args:
    executable: /bin/zsh
    chdir: "{{ admin_home_dir }}"

- name: Trigger install tools script
  ansible.builtin.shell: |
    source ~/.zshenv
    source ~/.zshrc
    # Comment for debugging as it can hit github api rate limit
    script-update-local-packages
    # Produce some output
    echo 'DEBUG: Output'
  args:
    executable: /bin/zsh
    chdir: "{{ admin_home_dir }}"
  register: script_output

- debug:
    var: script_output.stdout_lines

- name: Ensure nvim cache directory exists
  ansible.builtin.file:
    path: "{{ admin_home_dir }}/.cache/nvim"
    state: directory

- name: Install Python 3.12 via uv
  ansible.builtin.command: uv python install 3.12
  register: uv_install
  changed_when: "'installed' in uv_install.stdout"

- name: Create uv virtualenv for neovim
  ansible.builtin.command: uv venv {{ admin_home_dir }}/.cache/nvim/uv-python --python 3.12
  args:
    creates: "{{ admin_home_dir }}/.cache/nvim/uv-python"

- name: Install pynvim into uv venv for neovim
  ansible.builtin.command: "uv pip install pynvim --python {{ admin_home_dir }}/.cache/nvim/uv-python/bin/python"

- name: Install uv tools
  ansible.builtin.shell: |
    source ~/.zshenv
    source ~/.zshrc
    tools=("${(@f)$(< {{ admin_home_dir }}/dotfiles/other_configs/uv_tools.txt)}")
    for tool in "${tools[@]}"; do
      [[ -z "$tool" ]] && continue
      echo "Installing $tool"
      uv tool install "$tool"
    done
  args:
    executable: /bin/zsh
    chdir: "{{ admin_home_dir }}"
  register: uv_tools_output

- debug:
    var: uv_tools_output.stdout_lines

- debug:
    var: uv_tools_output.stderr_lines

- name: Install tmux tpm
  ansible.builtin.shell: |
    source ~/.zshenv
    source ~/.zshrc
    {{ admin_home_dir }}/dotfiles/scripts/install_tmux_tpm.sh
  args:
    executable: /bin/zsh
    chdir: "{{ admin_home_dir }}"

- name: Install unoserver
  ansible.builtin.shell: |
    source ~/.zshenv
    source ~/.zshrc
    {{ admin_home_dir }}/dotfiles/scripts/install_unoserver.sh
  args:
    executable: /bin/zsh
    chdir: "{{ admin_home_dir }}"

- name: Install tree-sitter-cli via Cargo
  ansible.builtin.shell: |
    source ~/.zshenv
    source ~/.zshrc
    cargo install tree-sitter-cli --locked
  args:
    executable: /bin/zsh
    chdir: "{{ admin_home_dir }}"

- name: Ensure systemd contianer user directory exists
  ansible.builtin.file:
    path: "{{ admin_home_dir }}/.config/containers/systemd"
    state: directory
    mode: '0755'

- name: Enable podman-auto-update timer
  ansible.builtin.systemd:
    name: podman-auto-update.timer
    state: started
    enabled: true
    scope: user
