---
- name: Ensure the PXE Pod exists
  containers.podman.podman_pod:
    name: pxe_pod
    state: created
    network: host

- name: Run dnsmasq Container
  containers.podman.podman_container:
    name: pxe_dnsmasq
    image: docker.io/4km3/dnsmasq
    pod: pxe_pod
    state: started
    recreate: true
    privileged: true
    cap_add:
      - NET_ADMIN
      - NET_BIND_SERVICE
      - NET_RAW
    volumes:
      - "{{ base_dir }}/dnsmasq.conf:/etc/dnsmasq.conf:Z"

- name: Run TFTP Container (Alpine)
  containers.podman.podman_container:
    name: pxe_tftp
    image: docker.io/library/alpine:latest
    pod: pxe_pod
    state: started
    recreate: true
    privileged: true
    cap_add:
      - NET_BIND_SERVICE
    command:
      - /bin/sh
      - "-c"
      - "apk add --no-cache tftp-hpa && { syslogd -n -O /dev/stdout & } && exec /usr/sbin/in.tftpd --foreground -vvv --address 0.0.0.0:69 --map-file /etc/tftpd.map --secure /var/lib/tftpboot"
    volumes:
      - "{{ base_dir }}/tftp:/var/lib/tftpboot:Z"
      - "{{ base_dir }}/tftpd.map:/etc/tftpd.map:ro,Z"

- name: Run Nginx Container
  containers.podman.podman_container:
    name: pxe_http
    image: docker.io/library/nginx:alpine
    pod: pxe_pod
    state: started
    recreate: true
    privileged: true
    volumes:
      - "{{ base_dir }}/nginx.conf:/etc/nginx/nginx.conf:ro,Z"
      - "{{ base_dir }}/www:/usr/share/nginx/html:ro,Z"
