      - fuse
      - fuse3
      - squashfuse
      - tuned
      - tuned-ppd
      - upower
      - podman
      - podman-docker
      - podman-compose
      - firewalld
      - acpid
      - ltrace
      - strace
      - irqbalance
      - rsyslog
      - vim
      - bc
      - findutils
      - lshw
      - gawk
      - openssl
      - wget2
      - curl
      - rsync
      - jq
      - yq
      - zsh
      - trash-cli
      - ncdu
      - ncurses
      - fastfetch
      - fdupes
      - git
      - tmux
      - rpmconf
      - lm_sensors
      - htop
      - btop
      - powertop
      - nvtop
      - iotop-c
      - fatrace
      - libarchive
      - unzip
      - libzip
      - lzop
      - arj
      - transmission-cli
      - poppler-utils
