---
- name: Remove PXE directory structure
  ansible.builtin.file:
    path: "{{ base_dir }}"
    state: directory
    mode: '0755'

- name: Create TFTP directory structure
  ansible.builtin.file:
    path: "{{ base_dir }}/tftp/{{ selected_arch }}"
    state: directory
    mode: '0755'

- name: Create HTTP directory structure
  ansible.builtin.file:
    path: "{{ base_dir }}/www/{{ selected_arch }}"
    state: directory
    mode: '0755'
