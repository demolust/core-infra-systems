---
- name: Network Nodes Setup
  hosts: network_nodes
  become: true
  gather_facts: true
  vars:
    ansible_python_interpreter: /usr/bin/python3

  pre_tasks:
  - name: Pre setup
    ansible.builtin.include_tasks: tasks/pre_setup.yml

  tasks:
    - name: System setup
      ansible.builtin.include_tasks: tasks/system_setup.yml

    - name: Base network setup
      ansible.builtin.include_tasks: tasks/network_setup.yml

    - name: Prepare container dependencies
      ansible.builtin.import_tasks: tasks/container_deps.yml

    - name: Deploy and configure all Quadlet services
      ansible.builtin.include_tasks: tasks/container_apps_setup.yml
      loop: "{{ quadlet_services }}"
      loop_control:
        loop_var: app
        label: "{{ app.name }}"

    - name: Fiewall setup
      ansible.builtin.include_tasks: tasks/firewall_setup.yml

    - name: VPN setup
      ansible.builtin.include_tasks: tasks/vpn_setup.yml

  handlers:
    - name: Load Handlers
      ansible.builtin.import_tasks: handlers/handlers.yml
