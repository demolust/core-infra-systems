      - ndctl
      - parallel
      - nmap
      - util-linux
      - hdparm
      - nvme-cli
      - sysstat
      - fuse
      - fuse3
      - squashfuse
      - tuned
      - tuned-ppd
      - upower
      - podman
      - podman-docker
      - podman-compose
      - firewalld
      - acpid
      - ltrace
      - strace
      - irqbalance
      - rsyslog
      - vim
      - bc
      - findutils
      - lshw
      - gawk
      - openssl
      - wget2
      - curl
      - rsync
      - jq
      - yq
      - zsh
      - trash-cli
      - ncdu
      - ncurses
      - fastfetch
      - fdupes
      - git
      - tmux
      - rpmconf
      - lm_sensors
      - htop
      - btop
      - powertop
      - nvtop
      - iotop-c
      - fatrace
      - libarchive
      - unzip
      - libzip
      - lzop
      - arj
      - transmission-cli
      - poppler-utils
      - atool
      - unrar
      - p7zip
      - p7zip-plugins
      - pdftk-java
      - pandoc
      - poppler
      - ffmpegthumbnailer
      - tumbler
      - ImageMagick
      - mediainfo
      - perl-Image-ExifTool
      - odt2txt
      - elinks
      - lynx
      - w3m
      - w3m-img
      - gnome-epub-thumbnailer
      - xmlstarlet
      - libcdio
      - genisoimage
      - python3-virtualenv
      - libreoffice-core
      - libreoffice-pyuno
      - ranger
      - zoxide
      - gdu
      - git-delta
      - fd-find
      - bat
      - tldr
      - fzf
      - procs
      - rust
      - cargo
      - nodejs
      - npm
      - golang
      - java-25-openjdk-headless
    state: present
    update_cache: true
  when: ansible_os_family == "RedHat"

- name: Install devel packages (Fedora/RedHat)
  ansible.builtin.dnf:
    name:
      - make
      - cmake
      - automake
      - bison
      - pkg-config
      - ninja-build
      - autoconf
      - libtool
      - patch
      - gettext
      - gcc
      - gcc-c++
      - clang
      - clang-libs
      - llvm-devel
      - libevent-devel
      - libutempter-devel
      - zlib-devel
      - rpm-build
      - rpmdevtools
      - doxygen
      - tk
      - python3-toml
      - python3-tomli
      - pyproject-rpm-macros
      - brotli-devel
      - curl-devel
      - freeglut-devel
      - freetype-devel
      - gumbo-parser-devel
      - harfbuzz-devel
      - jbig2dec-devel
      - leptonica-devel
      - libXext-devel
      - libXi-devel
      - libXrandr-devel
      - libjpeg-devel
      - mesa-libEGL-devel
      - mesa-libGL-devel
      - mesa-libGLU-devel
      - openjpeg2-devel
      - python3-clang
      - python3-devel
      - swig
      - tesseract-devel
    state: present
    update_cache: true
  when: ansible_os_family == "RedHat"

- name: Clone Neovim Source
  ansible.builtin.git:
    repo: https://github.com/neovim/neovim
    dest: /tmp/neovim
    version: stable
    depth: 1

- name: Build Neovim from source
  ansible.builtin.shell: |
    cd /tmp/neovim
    make CMAKE_BUILD_TYPE=RelWithDebInfo
    make install
  args:
    creates: /usr/local/bin/nvim

- name: Clone tmux Source
  ansible.builtin.git:
    repo: https://github.com/tmux/tmux
    dest: /tmp/tmux
    version: 3.6a
    depth: 1

- name: Build tmux from source
  ansible.builtin.shell: |
    cd /tmp/tmux
    sh autogen.sh
    ./configure
    make
    make install
  args:
    creates: /usr/local/bin/tmux

- name: Set build rpms envs
  ansible.builtin.set_fact:
    id3lib_srpm_url: "https://dl.fedoraproject.org/pub/fedora/linux/releases/43/Everything/source/tree/Packages/i/id3lib-3.8.3-61.fc43.src.rpm"
    id3v2_srpm_url: "https://dl.fedoraproject.org/pub/fedora/linux/releases/43/Everything/source/tree/Packages/i/id3v2-0.1.12-40.fc43.src.rpm"
    catdoc_srpm_url: "https://dl.fedoraproject.org/pub/fedora/linux/releases/43/Everything/source/tree/Packages/c/catdoc-0.95-28.fc43.src.rpm"
    mupdf_srpm_url: "https://dl.fedoraproject.org/pub/fedora/linux/releases/43/Everything/source/tree/Packages/m/mupdf-1.26.9-3.fc43.src.rpm"
    build_dir: "/tmp/builds"

- name: Create build directory
  ansible.builtin.file:
    path: "{{ build_dir }}"
    state: directory
    mode: '0755'

- name: Download required SRPMs
  ansible.builtin.get_url:
    url: "{{ item.url }}"
    dest: "{{ build_dir }}/{{ item.dest }}"
  loop:
    - { url: "{{ id3lib_srpm_url }}", dest: "id3lib.src.rpm" }
    - { url: "{{ id3v2_srpm_url }}",  dest: "id3v2.src.rpm" }
    - { url: "{{ catdoc_srpm_url }}", dest: "catdoc.src.rpm" }
    - { url: "{{ mupdf_srpm_url }}",  dest: "mupdf.src.rpm" }

- name: Rebuild id3lib (Dependency)
  ansible.builtin.command: "rpmbuild --rebuild {{ build_dir }}/id3lib.src.rpm"
  args:
    creates: "/root/rpmbuild/RPMS/{{ current_arch }}/id3lib-3.8.3-61.el9.{{ current_arch }}.rpm"

- name: Install id3lib
  ansible.builtin.shell: "dnf install -y /root/rpmbuild/RPMS/{{ current_arch }}/id3lib-*.rpm"
  register: dnf_init
  changed_when: "'Nothing to do' not in dnf_init.stdout"

- name: Rebuild SRPMs
  ansible.builtin.command: "rpmbuild --rebuild {{ build_dir }}/{{ item.srpm }}.src.rpm"
  args:
    creates: "/root/rpmbuild/RPMS/{{ current_arch }}/{{ item.creates }}.{{ current_arch }}.rpm"
  loop: &rpm_list
    - { srpm: 'id3v2',  creates: 'id3v2-0.1.12-40.el9' }
    - { srpm: 'catdoc', creates: 'catdoc-0.95-28.el9' }
    - { srpm: 'mupdf',  creates: 'mupdf-1.26.9-3.el9' }

- name: Install built RPM packages
  ansible.builtin.shell: "dnf install -y /root/rpmbuild/RPMS/{{ current_arch }}/{{ item.srpm }}-*.rpm"
  loop: *rpm_list
  register: dnf_output
  changed_when: "'Nothing to do' not in dnf_output.stdout"

- name: Create|Update the system groups
  ansible.builtin.group:
    name: "{{ item.value }}"
    state: present
    system: true
  loop: "{{ system_groups | dict2items }}"

- name: Create|Update the system users
  ansible.builtin.user:
    name: "{{ item.value.name }}"
    home: "/var/lib/{{ item.value.name }}"
    create_home: true
    system: true
    shell: "{{ item.value.shell | default('/usr/sbin/nologin') }}"
    group: "{{ item.value.group | default(item.value.name) }}"
    groups: "{{ item.value.groups | default(omit) }}"
    append: true
    state: present
  loop: "{{ system_users | dict2items }}"

- name: Ensure system users Quadlet directories exist
  ansible.builtin.file:
    path: "/var/lib/{{ item.value.name }}/.config/containers/systemd"
    state: directory
    owner: "{{ item.value.name }}"
    group: "{{ item.value.name }}"
    mode: '0755'
  loop: "{{ system_users | dict2items }}"

- name: Enable systemd linger for system users
  ansible.builtin.command:
    cmd: "loginctl enable-linger {{ item.value.name }}"
    creates: "/var/lib/systemd/linger/{{ item.value.name }}"
  loop: "{{ system_users | dict2items }}"

- name: Create specific directory tree with permissions and SELinux
  ansible.builtin.file:
    path: "{{ item.1 }}"
    state: directory
    owner: "{{ item.0.owner }}"
    group: "{{ item.0.group }}"
    mode: "{{ item.0.mode }}"
    setype: "{{ item.0.setype | default(omit) }}"
  with_subelements:
    - "{{ data_directories }}"
    - paths

- name: "Get {{ system_users.runner.name }} runner user details"
  ansible.builtin.getent:
    database: passwd
    key: runner

- name: "Set {{ system_users.runner.name }} home directory fact"
  ansible.builtin.set_fact:
    runner_home: "{{ getent_passwd[system_users.runner.name][4] }}"

- name: Deploy application initialization files
  ansible.builtin.template:
    src: "target/{{ item.name }}"
    dest: "{{ item.dest }}"
    owner: "{{ item.owner }}"
    group: "{{ item.group }}"
    mode: '0644'
  loop:
    # UniFi
    - { name: "unifi.env.j2", dest: "{{ unifi_env_file }}", owner: "{{ system_users.unifi.name }}", group: "{{ system_groups.unifi }}" }
    - { name: "init-mongo.js.j2", dest: "{{ unifi_paths.init }}/init-mongo.js", owner: "{{ system_users.unifi.name }}", group: "{{ system_groups.unifi }}" }
    # Vault
    - { name: "vault.env.j2", dest: "{{ vault_env_file }}", owner: "{{ system_users.vault.name }}", group: "{{ system_groups.vault }}" }
    - { name: "vault.hcl.j2", dest: "{{ vault_init_file }}", owner: "{{ system_users.vault.name }}", group: "{{ system_groups.vault }}" }
    # NetBox
    - { name: "netbox.env.j2", dest: "{{ netbox_env_file }}", owner: "{{ system_users.netbox.name }}", group: "{{ system_groups.netbox }}" }
    # Runner
    - { name: "runner.env.j2", dest: "{{ runner_env_file }}", owner: "{{ system_users.runner.name }}", group: "{{ system_groups.runner }}" }
    - { name: "runner_auth.json.j2", dest: "{{ runner_home }}/.config/containers/auth.json", owner: "{{ system_users.runner.name }}", group: "{{ system_groups.runner }}" }

- name: Ensure subuid/subgid ranges for system users
  ansible.builtin.lineinfile:
    path: "/etc/{{ item[1] }}"
    line: "{{ item[0].value.name }}:{{ 100000 + (ansible_loop.index0 * 65536) }}:65536"
    regexp: "^{{ item[0].value.name }}:"
    state: present
  loop: "{{ system_users | dict2items | product(['subuid', 'subgid']) | list }}"
  loop_control:
    extended: true

- name: Deploy gitops_aliases.sh to profile.d
  ansible.builtin.template:
    src: target/gitops_aliases.sh.j2
    dest: /etc/profile.d/gitops_aliases.sh
    owner: root
    group: root
    mode: '0644'

- name: "Ensure public_content_rw_t context is defined for {{ data_basedir }} and its contents"
  community.general.sefcontext:
    target: "{{ item }}"
    setype: public_content_rw_t
    state: present
  loop:
    - "{{ data_basedir }}"
    - "{{ data_basedir }}(/.*)?"
  register: selinux_context_changed

- name: Apply new SELinux context to files on disk
  ansible.builtin.command: "restorecon -Rv {{ data_basedir }}"
  when: selinux_context_changed.changed
  changed_when: true

- name: Add selinux booleans to allow general interactation with public shared content
  ansible.posix.seboolean:
    name: "{{ item }}"
    state: true
    persistent: true
  loop:
    # Containers read & interact public shared content
    - container_manage_public_content
    - container_read_public_content
    - container_manage_cgroup
    - container_use_devices
    - virt_use_samba
    # Samba read/write public_content_rw_t shares
    - smbd_anon_write

- name: Harden SSH configuration
  ansible.builtin.lineinfile:
    path: /etc/ssh/sshd_config
    regexp: "{{ item.regexp }}"
    line: "{{ item.line }}"
    state: present
    validate: '/usr/sbin/sshd -t -f %s'
  loop:
    - { regexp: '^#?PermitRootLogin', line: 'PermitRootLogin no' }
    - { regexp: '^#?PasswordAuthentication', line: 'PasswordAuthentication no' }
    - { regexp: '^#?MaxAuthTries', line: 'MaxAuthTries 3' }
  notify: Restart sshd
