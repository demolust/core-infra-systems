---
- name: Deploy bootstrap configuration files
  ansible.builtin.template:
    src: "bootstrap/{{ item.src }}"
    dest: "{{ item.dest }}"
    mode: "{{ item.mode | default('0644') }}"
  loop:
    - { src: 'dnsmasq.conf.j2', dest: "{{ base_dir }}/dnsmasq.conf" }
    - { src: 'nginx.conf.j2',   dest: "{{ base_dir }}/nginx.conf" }
    - { src: 'tftpd.map.j2',    dest: "{{ base_dir }}/tftpd.map" }
    - { src: 'grub.cfg.j2',     dest: "{{ base_dir }}/tftp/{{ selected_arch }}/grub.cfg" }
    - { src: 'boot.ipxe.j2',    dest: "{{ base_dir }}/www/{{ selected_arch }}/boot.ipxe" }
    - { src: 'ks.cfg.j2',       dest: "{{ base_dir }}/www/{{ selected_arch }}/ks.cfg" }
