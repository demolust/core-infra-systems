---
- name: Control Node Setup
  hosts: control_nodes
  become: true
  gather_facts: true
  vars:
    ansible_python_interpreter: /usr/bin/python3
  tasks:
    - name: Install base apps
      ansible.builtin.import_tasks: tasks/base_install.yml

    - name: Setup user
      ansible.builtin.import_tasks: tasks/user_setup.yml

    - name: Install main server apps
      ansible.builtin.import_tasks: tasks/main_install.yml

    - name: Config user
      ansible.builtin.import_tasks: tasks/user_config.yml
      vars:
        ansible_become_user: "{{ admin_username }}"

    - name: Deploy and Configure all Quadlet Services
      ansible.builtin.include_tasks: tasks/container_apps_setup.yml
      loop: "{{ quadlet_services }}"
      loop_control:
        loop_var: app

  handlers:
    - name: Load Control Node Handlers
      ansible.builtin.import_tasks: handlers/handlers.yml
