- name: Enable podman-auto-update timer
  ansible.builtin.systemd:
    name: podman-auto-update.timer
    state: started
    enabled: true

- name: Allow Samba service via firewalld
  ansible.posix.firewalld:
    service: samba
    permanent: true
    state: enabled
    immediate: true
  when: ansible_os_family == "RedHat"

- name: Allow application ports via firewalld
  ansible.posix.firewalld:
    port: "{{ item }}"
    permanent: true
    state: enabled
    immediate: true
  when: ansible_os_family == "RedHat"
  loop:
    - "{{ navidrome_port }}/tcp"
    - "{{ vault_port }}/tcp"
    - "{{ netbox_port }}/tcp"

- name: Allow Unifi Controller ports via firewalld
  ansible.posix.firewalld:
    port: "{{ item.host }}/{{ item.proto }}"
    permanent: true
    state: enabled
    immediate: true
  loop: "{{ unifi_ports }}"
  when: ansible_os_family == "RedHat"

- name: Allow PXE ports via firewalld
  ansible.posix.firewalld:
    service: "{{ item.name | default(omit) }}"
    port: "{{ (item.port + '/' + item.proto) if item.name is not defined else omit }}"
    permanent: true
    state: enabled
    immediate: true
  loop: "{{ pxe_services }}"
  when: ansible_os_family == "RedHat"

- name: Create PXE directory structure
  ansible.builtin.file:
    path: "{{ pxe_base_dir }}/{{ item }}"
    state: directory
    mode: '2775'
    owner: "root"
    group: "wheel"
  loop:
    - "."
    - "configs"
    - "isos"
    - "images"
    - "tftp/ipxe/configs"
    - "tftp/x86_64/rescue"
    - "tftp/aarch64/rescue"
    - "www/ipxe/configs"
    - "www/x86_64/rescue"
    - "www/aarch64/rescue"

- name: Sync host identity files for Samba container
  ansible.builtin.copy:
    src: "{{ item.src }}"
    dest: "{{ item.dest }}"
    remote_src: true
    mode: '0644'
  loop:
    - { src: '/etc/passwd', dest: "{{ samba_conf_dir }}/host-passwd" }
    - { src: '/etc/group', dest: "{{ samba_conf_dir }}/host-group" }

- name: Deploy root containers configuration files
  ansible.builtin.template:
    src: "target/{{ item.src }}"
    dest: "{{ item.dest }}"
    mode: "{{ item.mode | default('0664') }}"
    owner: "root"
    group: "wheel"
  loop:
    - { src: 'smb.conf.j2', dest: "{{ samba_conf_dir }}/smb.conf" }
    - { src: 'samba_entrypoint.sh.j2', dest: "{{ samba_conf_dir }}/entrypoint.sh", mode: "0775" }
    - { src: 'dnsmasq.conf.j2', dest: "{{ pxe_base_dir }}/configs/dnsmasq.conf" }
    - { src: 'nginx.conf.j2',   dest: "{{ pxe_base_dir }}/configs/nginx.conf" }
    - { src: 'tftpd.map.j2',    dest: "{{ pxe_base_dir }}/configs/tftpd.map" }
    - { src: 'grub.cfg.j2',     dest: "{{ pxe_base_dir }}/tftp/grub.cfg" }
    - { src: 'boot.ipxe.j2',    dest: "{{ pxe_base_dir }}/tftp/ipxe/configs/boot.ipxe" }
    - { src: 'boot.ipxe.j2',    dest: "{{ pxe_base_dir }}/www/ipxe/configs/boot.ipxe" }
  register: config_results

- name: Pre-stage Samba user database using matching container version
  containers.podman.podman_container:
    name: samba_db_generator
    image: docker.io/instantlinux/samba:latest
    rm: true
    state: started
    detach: false
    entrypoint: "/bin/sh"
    command:
      - "-c"
      - |
        awk -F: '$3 >= 1000' /host-etc/passwd >> /etc/passwd
        awk -F: '$3 >= 1000' /host-etc/group >> /etc/group
        grep -E '^{{ system_groups.share | quote }}:' /host-etc/group >> /etc/group || true
        printf "[global]\npassdb backend = tdbsam:/private/passdb.tdb\n" > /tmp/bootstrap.conf
        if ! pdbedit -b tdbsam:/private/passdb.tdb -u {{ item.name | quote }} > /dev/null 2>&1; then
          (echo {{ item.password | quote }}; echo {{ item.password | quote }}) | smbpasswd -c /tmp/bootstrap.conf -s -a {{ item.name | quote }}
        else
          (echo {{ item.password | quote }}; echo {{ item.password | quote }}) | smbpasswd -c /tmp/bootstrap.conf -s {{ item.name | quote }}
        fi
    volumes:
      - "{{ samba_priv_dir }}:/private:Z"
      - "{{ samba_conf_dir }}/host-passwd:/host-etc/passwd:Z,ro"
      - "{{ samba_conf_dir }}/host-group:/host-etc/group:Z,ro"
  loop: "{{ samba_users }}"
  no_log: true

- name: Download the latest iPXE files mapped to local architecture names
  ansible.builtin.get_url:
    url: "https://boot.ipxe.org/{{ item.remote_arch }}/ipxe.efi"
    dest: "{{ pxe_base_dir }}/tftp/{{ item.local_arch }}/ipxe.efi"
    mode: '0644'
    force: false
  loop:
    - { remote_arch: 'x86_64-efi', local_arch: 'x86_64' }
    - { remote_arch: 'arm64-efi', local_arch: 'aarch64' }

- name: Ensure root systemd contianer directory exists
  ansible.builtin.file:
    path: "/etc/containers/systemd"
    state: directory
    mode: '0755'

- name: Deploy root Quadlet files
  ansible.builtin.template:
    src: "target/{{ item.src }}"
    dest: "/etc/containers/systemd/{{ item.dest }}"
  loop:
    - { src: 'samba.container.j2', dest: 'samba.container' }
    - { src: 'pxe.pod.j2', dest: 'pxe.pod' }
    - { src: 'pxe_dnsmasq.container.j2', dest: 'pxe_dnsmasq.container' }
    - { src: 'pxe_tftp.container.j2', dest: 'pxe_tftp.container' }
    - { src: 'pxe_nginx.container.j2', dest: 'pxe_nginx.container' }
  register: quadlet_results

- name: Reload systemd to generate service from Quadlet
  ansible.builtin.systemd:
    daemon_reload: true
  when: quadlet_results.changed

- name: Start root containers
  ansible.builtin.systemd:
    name: "{{ item }}"
    state: restarted
    enabled: true
  loop:
    - pxe-pod.service
    - samba.service
  when: quadlet_results.changed or config_results.changed
