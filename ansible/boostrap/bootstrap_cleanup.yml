---
- name: Clean up bootstrap PXE environment
  hosts: localhost
  connection: local
  gather_facts: true

  tasks:
    - name: Stop Podman services
      block:
        - name: Stop Podman services with privilege escalation
          ansible.builtin.import_tasks: tasks/container_cln.yml
      become: true

    - name: Clean up host networking and security
      block:
        - name: Clean up host networking and security with privilege escalation
          ansible.builtin.import_tasks: tasks/host_setup_cln.yml
      become: true

    - name: Clean up directory structure
      ansible.builtin.import_tasks: tasks/dir_structure_cln.yml
