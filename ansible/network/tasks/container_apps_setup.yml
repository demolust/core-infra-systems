---
- name: "Deploy {{ app.name }} configuration files"
  ansible.builtin.template:
    src: "{{ item.src }}"
    dest: "{{ item.dest }}"
    mode: "{{ item.mode | default('0664') }}"
    owner: "root"
    group: "wheel"
    force: "{{ item.force | default('true') }}"
  loop: "{{ app.configs | default([]) }}"
  register: configs

- name: "Deploy {{ app.name }} Quadlet files"
  ansible.builtin.template:
    src: "{{ item.src }}"
    dest: "/etc/containers/systemd/{{ item.dest }}"
  loop: "{{ app.templates | default([]) }}"
  register: quadlets

- name: Reload systemd to generate service from Quadlet
  ansible.builtin.systemd:
    daemon_reload: true
  when: quadlets.changed

- name: "Restart {{ app.name }} when files changed"
  ansible.builtin.systemd:
    name: "{{ app.service }}"
    state: restarted
    enabled: true
  when: quadlets.changed or configs.changed
