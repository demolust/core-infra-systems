---
- name: Ensure administrator group exists for {{ admin_username }}
  ansible.builtin.group:
    name: "{{ admin_username }}"
    state: present

- name: Ensure administrator account exists for {{ admin_username }}
  ansible.builtin.user:
    name: "{{ admin_username }}"
    password: "{{ admin_password_hash }}"
    shell: /usr/bin/zsh
    create_home: true
    groups: wheel,{{ system_groups.share }},{{ system_groups.gitops }},{{ admin_username }}
    append: true
    state: present

- name: Deploy SSH public key
  ansible.posix.authorized_key:
    user: "{{ admin_username }}"
    state: present
    key: "{{ admin_ssh_pub_key }}"

- name: Enable lingering for the user
  ansible.builtin.command: "loginctl enable-linger {{ admin_username }}"
  args:
    creates: "/var/lib/systemd/linger/{{ admin_username }}"
