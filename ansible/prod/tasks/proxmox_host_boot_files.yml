---
- name: Render Proxmox answer
  ansible.builtin.template:
    src: proxmox_answer.toml.j2
    dest: "{{ pxe_base_dir }}/www/configs/proxmox/{{ reservation.mac | lower | replace(':', '-') }}.toml"
    owner: root
    group: wheel
    mode: '0644'
  no_log: true
  diff: false

- name: Render Proxmox boot script
  ansible.builtin.template:
    src: proxmox_boot.ipxe.j2
    dest: "{{ pxe_base_dir }}/www/configs/ipxe/{{ reservation.mac | lower | replace(':', '-') }}.ipxe"
    owner: root
    group: wheel
    mode: '0644'
