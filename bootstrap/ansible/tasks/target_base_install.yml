- name: Install devel packages (Fedora/RedHat)
  ansible.builtin.dnf:
    name:
      - make
      - cmake
      - automake
      - bison
      - pkg-config
      - ninja-build
      - autoconf
      - libtool
      - patch
      - gettext
      - gcc
      - gcc-c++
      - clang
      - clang-libs
      - llvm-devel
      - libevent-devel
      - libutempter-devel
      - zlib-devel
      - rpm-build
      - rpmdevtools
      - doxygen
      - tk
    state: present
    update_cache: true
  when: ansible_os_family == "RedHat"

- name: Clone Neovim Source
  git:
    repo: https://github.com/neovim/neovim
    dest: /tmp/neovim
    version: stable
    depth: 1

- name: Build Neovim from source
  shell: |
    cd /tmp/neovim
    make CMAKE_BUILD_TYPE=RelWithDebInfo
    make install
  args:
    creates: /usr/local/bin/nvim

- name: Clone tmux Source
  git:
    repo: https://github.com/tmux/tmux
    dest: /tmp/tmux
    version: 3.6a
    depth: 1

- name: Build tmux from source
  shell: |
    cd /tmp/tmux
    sh autogen.sh
    ./configure
    make
    make install
  args:
    creates: /usr/local/bin/tmux

- name: Set id3v2 envs
  ansible.builtin.set_fact:
    id3lib_srpm_url: "https://dl.fedoraproject.org/pub/fedora/linux/releases/43/Everything/source/tree/Packages/i/id3lib-3.8.3-61.fc43.src.rpm"
    id3v2_srpm_url: "https://dl.fedoraproject.org/pub/fedora/linux/releases/43/Everything/source/tree/Packages/i/id3v2-0.1.12-40.fc43.src.rpm"
    catdoc_srpm_url: "https://dl.fedoraproject.org/pub/fedora/linux/releases/43/Everything/source/tree/Packages/c/catdoc-0.95-28.fc43.src.rpm"
    build_dir: "/tmp/builds"

- name: Create build directory
  ansible.builtin.file:
    path: "{{ build_dir }}"
    state: directory
    mode: '0755'

- name: Download id3lib SRPM
  ansible.builtin.get_url:
    url: "{{ id3lib_srpm_url }}"
    dest: "{{ build_dir }}/id3lib.src.rpm"

- name: Download id3v2 SRPM
  ansible.builtin.get_url:
    url: "{{ id3v2_srpm_url }}"
    dest: "{{ build_dir }}/id3v2.src.rpm"

- name: Download catdoc SRPM
  ansible.builtin.get_url:
    url: "{{ catdoc_srpm_url }}"
    dest: "{{ build_dir }}/catdoc.src.rpm"

- name: Rebuild id3lib (Library)
  command: "rpmbuild --rebuild {{ build_dir }}/id3lib.src.rpm"
  args:
    creates: "/root/rpmbuild/RPMS/{{ selected_arch }}/id3lib-3.8.3-61.el9.{{ selected_arch }}.rpm"

- name: Install built id3lib packages
  shell: "dnf install -y /root/rpmbuild/RPMS/{{ selected_arch }}/id3lib-*.rpm"

- name: Rebuild id3v2 (Tool)
  command: "rpmbuild --rebuild {{ build_dir }}/id3v2.src.rpm"
  args:
    creates: "/root/rpmbuild/RPMS/{{ selected_arch }}/id3v2-0.1.12-40.el9.{{ selected_arch }}.rpm"

- name: Install built id3v2 package
  shell: "dnf install -y /root/rpmbuild/RPMS/{{ selected_arch }}/id3v2-*.rpm"

- name: Rebuild catdoc (Tool)
  command: "rpmbuild --rebuild {{ build_dir }}/catdoc.src.rpm"
  args:
    creates: "/root/rpmbuild/RPMS/{{ selected_arch }}/catdoc-0.95-28.el9.{{ selected_arch }}.rpm"

- name: Install built catdoc package
  shell: "dnf install -y /root/rpmbuild/RPMS/{{ selected_arch }}/catdoc-*.rpm"
