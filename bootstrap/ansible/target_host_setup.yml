---
- name: Prepare Bootstrap Inventory
  hosts: localhost
  gather_facts: true
  vars:
    # To skip discovery steps use either `export TARGET_HOST_IP=1.2.3.4` or `-e "target_host_ip=1.2.3.4"`
    manual_target_host_ip: "{{ target_host_ip | default(lookup('env', 'TARGET_HOST_IP')) | default('', true) }}"
  tasks:
    - name: Discover Target IP via ARP cache
      ansible.builtin.shell: |
        ip neighbor show dev "{{ bootstrap_interface }}" | head -n 1 | awk '{print $1}'
      register: discovered_ip_result
      changed_when: false
      when: manual_target_host_ip == ""

    - name: Set target node IP fact
      ansible.builtin.set_fact:
        target_host_ip: "{{ manual_target_host_ip if manual_target_host_ip != '' else discovered_ip_result.stdout }}"

    - name: Fail if target node IP is missing
      ansible.builtin.fail:
        msg: "Could not discover the target node IP and no TARGET_HOST_IP env var was provided"
      when: target_host_ip == ""

    - name: Add the temp host to a virtual group
      ansible.builtin.add_host:
        name: "{{ target_host_ip }}"
        groups: bootstrap_hosts
        ansible_user: "{{ admin_username }}"
        ansible_ssh_extra_args: '-o StrictHostKeyChecking=no'

- name: Remote Target Host Setup
  hosts: bootstrap_hosts
  gather_facts: true
  become: true
  vars:
    ansible_python_interpreter: /usr/bin/python3
  tasks:
    - name: Install base apps
      ansible.builtin.import_tasks: tasks/target/base_install.yml

    - name: Setup user
      ansible.builtin.import_tasks: tasks/target/user_setup.yml

    - name: Install main server apps
      ansible.builtin.import_tasks: tasks/target/main_install.yml

    - name: Config user
      ansible.builtin.import_tasks: tasks/target/user_config.yml
      vars:
        ansible_become_user: "{{ admin_username }}"

  handlers:
    - name: Load Target Host Handlers
      ansible.builtin.import_tasks: handlers/target/host_handlers.yml
