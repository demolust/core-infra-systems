---
- name: Create TFTP directory structure
  ansible.builtin.file:
    path: "{{ item }}"
    state: directory
    mode: '0755'
  loop:
    - "{{ base_dir }}/tftp/{{ selected_arch }}"

- name: Ensure architecture directory exists
  ansible.builtin.file:
    path: "{{ base_dir }}/www/repo/{{ selected_arch }}"
    state: directory
    mode: '0755'
