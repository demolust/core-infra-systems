---
- name: System Update and Patching Playbook
  hosts: all
  become: true
  # Updates 25% of the infrastructure at a time to prevent simultaneous downtime
  serial: "25%"
  tasks:
    - name: Force metadata cache build (Debian/Ubuntu)
      ansible.builtin.apt:
        update_cache: true
        force_apt_get: true
      when: ansible_os_family == "Debian"

    - name: Update apt cache and upgrade all packages (Debian/Ubuntu)
      ansible.builtin.apt:
        upgrade: dist
      when: ansible_os_family == "Debian"

    - name: Force metadata cache build (RHEL/Rocky/AlmaLinux)
      ansible.builtin.dnf:
        update_cache: true
      when: ansible_os_family == "RedHat"

    - name: Upgrade all packages via DNF (RHEL/Rocky/AlmaLinux)
      ansible.builtin.dnf:
        name: "*"
        state: latest
      when: ansible_os_family == "RedHat"

    - name: Check if a reboot is required (Debian/Ubuntu)
      ansible.builtin.stat:
        path: /var/run/reboot-required
      register: debian_reboot_required
      when: ansible_os_family == "Debian"

    - name: Check if a reboot is required (RHEL/RedHat)
      ansible.builtin.command: dnf needs-restarting -r
      register: rhel_reboot_required
      failed_when: false
      changed_when: rhel_reboot_required.rc == 1
      when: ansible_os_family == "RedHat"

    - name: Reboot the server if a new kernel or system core was updated
      ansible.builtin.reboot:
        msg: "Reboot initiated by Ansible due to system updates"
        connect_timeout: 5
        reboot_timeout: 600
        pre_reboot_delay: 0
        post_reboot_delay: 30
        test_command: whoami
      when: >
        (ansible_os_family == "Debian" and debian_reboot_required.stat.exists) or
        (ansible_os_family == "RedHat" and rhel_reboot_required.rc == 1)
