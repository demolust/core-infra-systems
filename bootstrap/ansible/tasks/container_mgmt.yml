---
- name: Ensure the PXE Pod exists
  containers.podman.podman_pod:
    name: pxe_pod
    state: created
    network: host

- name: Run dnsmasq Container
  containers.podman.podman_container:
    name: pxe_dnsmasq
    image: docker.io/4km3/dnsmasq
    pod: pxe_pod
    state: started
    recreate: true
    cap_add:
      - NET_ADMIN
      - NET_BIND_SERVICE
      - NET_RAW
    volumes:
      - "{{ base_dir }}/dnsmasq.conf:/etc/dnsmasq.conf:Z,U"
      - "{{ base_dir }}/tftp:/var/lib/tftpboot:Z,U"

- name: Run Nginx Container
  containers.podman.podman_container:
    name: pxe_http
    image: docker.io/library/nginx:alpine
    pod: pxe_pod
    state: started
    recreate: true
    volumes:
      - "{{ base_dir }}/nginx.conf:/etc/nginx/nginx.conf:ro,Z,U"
      - "{{ base_dir }}/www:/usr/share/nginx/html:ro,Z,U"
