---
- name: Bootstrap Setup For PXE Environment
  hosts: localhost
  connection: local
  gather_facts: true

  tasks:
    - name: Creation of Directory Structure
      ansible.builtin.import_tasks: tasks/gen_dir_structure.yml

    - name: Prepare Host Networking and Security
      block:
        - name: Elevate for 'Prepare Host Networking and Security'
          ansible.builtin.import_tasks: tasks/host_prep.yml
      become: true

    - name: Process Installation Media
      ansible.builtin.import_tasks: tasks/img_manager.yml

    - name: Generate Configurations
      ansible.builtin.import_tasks: tasks/gen_templates_pxe.yml

    - name: Start Podman Services
      block:
        - name: Elevate for 'Start Podman Services'
          ansible.builtin.import_tasks: tasks/container_mgmt.yml
      become: true

  handlers:
    - name: Load Host Prep Handlers
      ansible.builtin.import_tasks: handlers/host_prep_handlers.yml
