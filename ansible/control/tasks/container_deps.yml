---
- name: Install container packages
  ansible.builtin.dnf:
    name:
      - podman
      - podman-docker
      - podman-compose
    state: present
    update_cache: true
  when: ansible_facts['os_family'] == "RedHat"

- name: Ensure root systemd container directory exists
  ansible.builtin.file:
    path: "/etc/containers/systemd"
    state: directory
    mode: '0755'

- name: Create root-owned application directories
  ansible.builtin.file:
    path: "{{ item.1 }}"
    state: directory
    owner: "{{ item.0.owner }}"
    group: "{{ item.0.group }}"
    mode: "{{ item.0.mode }}"
    setype: "{{ item.0.setype | default(omit) }}"
  with_subelements:
    - "{{ data_directories | selectattr('owner', 'equalto', 'root') | list }}"
    - paths

- name: Create PXE directory structure
  ansible.builtin.file:
    path: "{{ pxe_base_dir }}/{{ item }}"
    state: directory
    mode: '2775'
    owner: "root"
    group: "wheel"
  loop:
    - "."
    - "configs"
    - "isos"
    - "images"
    - "downloads"
    - "tftp/configs/ipxe"
    - "tftp/configs/grub"
    - "tftp/x86_64/rescue"
    - "tftp/aarch64/rescue"
    - "scripts/nginx"
    - "www/x86_64/rescue"
    - "www/aarch64/rescue"
    - "www/x86_64/proxmox"
    - "www/aarch64/proxmox"
    - "www/configs/proxmox"
    - "www/configs/ipxe"

- name: "Ensure public_content_rw_t context is defined for {{ data_basedir }} and its contents"
  community.general.sefcontext:
    target: "{{ item }}"
    setype: public_content_rw_t
    state: present
  loop:
    - "{{ data_basedir }}"
    - "{{ data_basedir }}(/.*)?"
  register: selinux_context_changed

- name: Apply new SELinux context to files on disk
  ansible.builtin.command: "restorecon -Rv {{ data_basedir }}"
  when: selinux_context_changed.changed
  changed_when: true

- name: Enable podman-auto-update timer
  ansible.builtin.systemd:
    name: podman-auto-update.timer
    state: started
    enabled: true

- name: Gather network IP address
  ansible.builtin.shell: "ip -o -4 addr show {{ pxe_interface }} | awk '{print $4}'"
  register: ip_info
  changed_when: false

- name: Set PXE server IP address fact
  ansible.builtin.set_fact:
    remote_server_ip: "{{ ip_info.stdout.split('/')[0] }}"

- name: Download the latest iPXE files mapped to local architecture names
  ansible.builtin.get_url:
    url: "https://boot.ipxe.org/{{ item.remote_arch }}/ipxe.efi"
    dest: "{{ pxe_base_dir }}/tftp/{{ item.local_arch }}/ipxe.efi"
    mode: '0644'
    force: false
  loop:
    - { remote_arch: 'x86_64-efi', local_arch: 'x86_64' }
    - { remote_arch: 'arm64-efi', local_arch: 'aarch64' }
