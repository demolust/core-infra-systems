---
- name: Set up bootstrap PXE environment
  hosts: localhost
  connection: local
  gather_facts: true

  tasks:
    - name: Create directory structure
      ansible.builtin.import_tasks: tasks/dir_structure_gen.yml

    - name: Prepare host networking and security
      block:
        - name: Prepare host networking and security with privilege escalation
          ansible.builtin.import_tasks: tasks/host_setup_gen.yml
      become: true

    - name: Process installation media
      ansible.builtin.import_tasks: tasks/img_manager_gen.yml

    - name: Generate configurations
      ansible.builtin.import_tasks: tasks/templates_pxe_gen.yml

    - name: Start Podman services
      block:
        - name: Start Podman services with privilege escalation
          ansible.builtin.import_tasks: tasks/container_gen.yml
      become: true

  handlers:
    - name: Load host preparation handlers
      ansible.builtin.import_tasks: handlers/handlers.yml
