---
- name: Bootstrap Setup For PXE Environment
  hosts: localhost
  connection: local
  gather_facts: true

  tasks:
    - name: Creation of Directory Structure
      ansible.builtin.import_tasks: tasks/bootstrap/dir_structure_gen.yml

    - name: Prepare Host Networking and Security
      block:
        - name: Elevate for 'Prepare Host Networking and Security'
          ansible.builtin.import_tasks: tasks/bootstrap/host_setup_gen.yml
      become: true

    - name: Process Installation Media
      ansible.builtin.import_tasks: tasks/bootstrap/img_manager_gen.yml

    - name: Generate Configurations
      ansible.builtin.import_tasks: tasks/bootstrap/templates_pxe_gen.yml

    - name: Start Podman Services
      block:
        - name: Elevate for 'Start Podman Services'
          ansible.builtin.import_tasks: tasks/bootstrap/container_gen.yml
      become: true

  handlers:
    - name: Load Host Prep Handlers
      ansible.builtin.import_tasks: handlers/boostrap/prep_handlers.yml
