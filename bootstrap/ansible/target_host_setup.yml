---
- name: Prepare Bootstrap Inventory
  hosts: localhost
  gather_facts: true
  vars:
    target_host_ip: "{{ lookup('env', 'TARGET_HOST_IP') }}"
  tasks:
    - name: Fail if variable is missing
      ansible.builtin.fail:
        msg: "Please set TARGET_HOST_IP env var first"
      when: target_host_ip == ''

    - name: Add the temp host to a virtual group
      ansible.builtin.add_host:
        name: "{{ target_host_ip }}"
        groups: bootstrap_hosts
        ansible_user: "{{ admin_username }}"
        ansible_ssh_extra_args: '-o StrictHostKeyChecking=no'

- name: Remote Target Host Setup
  hosts: bootstrap_hosts
  gather_facts: true
  become: true
  tasks:
    - name: Install base apps
      ansible.builtin.import_tasks: tasks/target_base_install.yml

    - name: Setup user
      ansible.builtin.import_tasks: tasks/target_user_setup.yml

    - name: Config user
      ansible.builtin.import_tasks: tasks/target_user_config.yml
      vars:
        ansible_become_user: "{{ gen_user }}"
