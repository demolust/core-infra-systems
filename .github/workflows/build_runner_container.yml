---
name: Build and Push Custom GitOps Runner Image

on:
  push:
    branches:
      - main
    paths:
      - 'bootstrap/runner_container/Dockerfile'
      - '.github/workflows/build_runner_container.yml'

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}

jobs:
  build-and-publish:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up QEMU for multi-arch builds
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Authenticate to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Compute Semantic Image Tags
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            type=edge,branch=main
            type=raw,value=v{{date 'YYYY.MM.DD'}}.{{sha}}

      - name: Build Verification Image Locally (No Push)
        uses: docker/build-push-action@v6
        with:
          context: ./bootstrap/runner_container
          platforms: linux/amd64
          file: ./bootstrap/runner_container/Dockerfile
          push: false
          load: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha

      - name: Check Verification Image Functionality
        run: |
          # Pluck the first generated tag from the metadata output
          TEST_TAG=$(echo "${{ steps.meta.outputs.tags }}" | head -n 1)
          echo "Testing image: $TEST_TAG"
          # Run the test using the custom entrypoint override
          docker run --rm --entrypoint /bin/bash $TEST_TAG -c "
            echo '--- Checking Ansible ---' && ansible --version && \
            echo '--- Checking Terraform ---' && terraform --version
          "

      - name: Build & Push Multi-arch Images to GHCR
        if: success()
        uses: docker/build-push-action@v6
        with:
          context: ./bootstrap/runner_container
          platforms: linux/amd64,linux/arm64
          file: ./bootstrap/runner_container/Dockerfile
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
