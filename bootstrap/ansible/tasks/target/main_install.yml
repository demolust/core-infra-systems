---
- name: Get Network Subnet and Mask
  ansible.builtin.shell: "ip route show dev {{ pxe_interface }} | grep 'proto kernel' | awk '{print $1}'"
  register: network_info
  changed_when: false

- name: Get Network IP
  ansible.builtin.shell: "ip -o -4 addr show {{ pxe_interface }} | awk '{print $4}'"
  register: ip_info
  changed_when: false

- name: Set facts for subnet and mask
  ansible.builtin.set_fact:
    remote_subnet: "{{ network_info.stdout.split('/')[0] }}"
    remote_netmask: "{{ network_info.stdout.split('/')[1] }}"
    remote_server_ip: "{{ ip_info.stdout.split('/')[0] }}"

