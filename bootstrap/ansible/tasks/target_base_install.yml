---
- name: Ensure major dependencies are installed (EPEL/config-manager)
  ansible.builtin.dnf:
    name:
      - epel-release
      - dnf-plugins-core
    state: present
    update_cache: true
  when:
    - ansible_os_family == "RedHat"
    - ansible_distribution != "Fedora"

- name: Check if CRB is already enabled
  shell: dnf repolist | grep -qi "^crb"
  register: crb_check
  failed_when: false
  changed_when: false

- name: Enable the CRB repository
  command: dnf config-manager --set-enabled crb
  register: crb_enable
  when: crb_check.rc != 0

- name: Enable Node.js 24 module stream
  ansible.builtin.dnf:
    name: "@nodejs:24"
    state: present

