---
- name: Set variables for the rest of the run
  ansible.builtin.set_fact:
    alma_version: "9"
    iso_type: "dvd"

- name: Set derived variables 1
  ansible.builtin.set_fact:
    remote_iso_name: "AlmaLinux-{{ alma_version }}-latest-{{ selected_arch }}-{{ iso_type }}.iso"

- name: Set derived variables 2
  ansible.builtin.set_fact:
    dest_path: "{{ base_dir }}/isos/{{ remote_iso_name }}"

- name: Extract SHA256 hash for the ISO
  ansible.builtin.set_fact:
    target_hash: >-
      {{ lookup('url', 'https://repo.almalinux.org/almalinux/{}/isos/{}/CHECKSUM'.format(alma_version, selected_arch), split_lines=False)
        | regex_search('SHA256 \(' ~ (remote_iso_name | regex_escape) ~ '\) = ([a-f0-9]{64})', '\1')
        | first }}

- name: Download the latest AlmaLinux {{ alma_version }} ISO
  ansible.builtin.get_url:
    url: "https://repo.almalinux.org/almalinux/{{ alma_version }}/isos/{{ selected_arch }}/{{ remote_iso_name }}"
    dest: "{{ dest_path }}"
    checksum: "sha256:{{ target_hash }}"
    mode: '0644'
    force: no
  register: download_result

- name: Show download status
  ansible.builtin.debug:
    msg: "ISO downloaded to {{ download_result.dest }}"

- name: Extract Boot Files (Kernel & Initrd)
  community.general.iso_extract:
    image: "{{ dest_path }}"
    dest: "{{ base_dir }}/tftp/{{ selected_arch }}"
    files:
      - "images/pxeboot/vmlinuz"
      - "images/pxeboot/initrd.img"
      - "{{ 'EFI/BOOT/BOOTX64.EFI' if selected_arch == 'x86_64' else 'EFI/BOOT/BOOTAA64.EFI' }}"
      - "{{ 'EFI/BOOT/grubx64.efi' if selected_arch == 'x86_64' else 'EFI/BOOT/grubaa64.efi' }}"

- name: Unpack Full ISO for HTTP Installation
  ansible.builtin.command:
    cmd: "7z x {{ dest_path }} -o{{ base_dir }}/www/repo/{{ selected_arch }}/ -y"
  args:
    creates: "{{ base_dir }}/www/repo/{{ selected_arch }}/BaseOS"

- name: Download the latest iPXE files
  ansible.builtin.get_url:
    url: "https://boot.ipxe.org/{{ 'x86_64-efi' if selected_arch == 'x86_64' else 'arm64-efi' }}/ipxe.efi"
    dest: "{{ base_dir }}/tftp/{{ selected_arch }}/ipxe.efi"
    mode: '0644'
    force: no
