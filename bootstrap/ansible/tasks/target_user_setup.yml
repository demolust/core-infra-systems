---
- name: Create|Update the user group of {{ admin_username }}
  ansible.builtin.group:
    name: "{{ admin_username }}"
    state: present

- name: Create|Update the user {{ admin_username }}
  ansible.builtin.user:
    name: "{{ admin_username }}"
    password: "{{ admin_password_hash }}"
    shell: /usr/bin/zsh
    create_home: true
    groups: wheel,{{ samba_share_group }},{{ admin_username }}
    append: true
    state: present

- name: Deploy SSH public key
  ansible.builtin.authorized_key:
    user: "{{ admin_username }}"
    state: present
    key: "{{ admin_ssh_pub_key }}"
