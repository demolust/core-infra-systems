---
- name: Install dependencies (Debian/Ubuntu)
  ansible.builtin.apt:
    name:
      - p7zip-full
      - genisoimage
      - podman
      - ufw
    state: present
    update_cache: true
  when: ansible_os_family == "Debian"

- name: Ensure EPEL is installed (RHEL/Rocky/Alma)
  ansible.builtin.dnf:
    name: epel-release
    state: present
  when:
    - ansible_os_family == "RedHat"
    - ansible_distribution != "Fedora"

- name: Install dependencies (Fedora/RedHat)
  ansible.builtin.dnf:
    name:
      - p7zip
      - p7zip-plugins
      - genisoimage
      - podman
      - firewalld
    state: present
    update_cache: true
  when: ansible_os_family == "RedHat"

- name: Allow rootless user to bind to privileged ports
  ansible.posix.sysctl:
    name: net.ipv4.ip_unprivileged_port_start
    value: '0'
    state: present
    sysctl_set: true

- name: Open ports via UFW
  community.general.ufw:
    rule: allow
    name: "{{ item.name | default(omit) }}"
    port: "{{ item.port if item.name is not defined else omit }}"
    proto: "{{ item.proto }}"
  loop: "{{ bootstrap_services }}"
  when: ansible_os_family == "Debian"

- name: Open ports via firewalld
  ansible.posix.firewalld:
    service: "{{ item.name | default(omit) }}"
    port: "{{ (item.port + '/' + item.proto) if item.name is not defined else omit }}"
    permanent: true
    state: enabled
    immediate: true
  loop: "{{ bootstrap_services }}"
  when: ansible_os_family == "RedHat"

- name: Open ports via iptables
  ansible.builtin.iptables:
    chain: INPUT
    protocol: "{{ item.proto }}"
    destination_port: "{{ item.port }}"
    jump: ACCEPT
    action: insert
  loop: "{{ bootstrap_services }}"
  when: ansible_os_family not in ["Debian", "RedHat"]

- name: Enable Kernel IP Forwarding
  ansible.posix.sysctl:
    name: net.ipv4.ip_forward
    value: '1'
    state: present
    reload: true

- name: Configure Firewalld Masquerade (NAT)
  ansible.posix.firewalld:
    masquerade: true
    state: enabled
    permanent: true
    immediate: true
  when: ansible_os_family == "RedHat"

- name: Configure UFW NAT
  block:
    - name: Allow Forwarding
      ansible.builtin.lineinfile:
        path: /etc/default/ufw
        regexp: '^DEFAULT_FORWARD_POLICY='
        line: 'DEFAULT_FORWARD_POLICY="ACCEPT"'

    - name: Insert NAT Rules
      ansible.builtin.blockinfile:
        path: /etc/ufw/before.rules
        insertbefore: "^# Don't delete these "
        block: |
          *nat
          :POSTROUTING ACCEPT [0:0]
          -A POSTROUTING -o {{ wan_interface }} -j MASQUERADE
          COMMIT
      notify: Reload UFW
  when: ansible_os_family == "Debian"

- name: Add temporary bootstrap IP
  ansible.builtin.command:
    cmd: "ip addr add {{ bootstrap_ip }}/{{ bootstrap_subnet}} dev {{ bootstrap_interface }}"
  register: add_ip
  failed_when:
    - add_ip.rc != 0
    - "'File exists' not in add_ip.stderr"
    - "'Error: ipv4: Address already assigned' not in add_ip.stderr"
  changed_when: add_ip.rc == 0
