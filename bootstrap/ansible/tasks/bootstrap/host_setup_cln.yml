---
- name: Deny rootless user to bind to privileged ports
  ansible.posix.sysctl:
    name: net.ipv4.ip_unprivileged_port_start
    value: '1024'
    state: present
    sysctl_set: true

- name: Close ports on UFW
  community.general.ufw:
    rule: delete
    name: "{{ item.name | default(omit) }}"
    port: "{{ item.port if item.name is not defined else omit }}"
    proto: "{{ item.proto }}"
  loop: "{{ pxe_services }}"
  when: ansible_os_family == "Debian"

- name: Close ports on firewalld
  ansible.posix.firewalld:
    service: "{{ item.name | default(omit) }}"
    port: "{{ (item.port + '/' + item.proto) if item.name is not defined else omit }}"
    permanent: true
    state: disabled
    immediate: true
  loop: "{{ pxe_services }}"
  when: ansible_os_family == "RedHat"

- name: Close ports via iptables
  ansible.builtin.iptables:
    chain: INPUT
    protocol: "{{ item.proto }}"
    destination_port: "{{ item.port }}"
    jump: ACCEPT
    action: remove
  loop: "{{ pxe_services }}"
  when: ansible_os_family not in ["Debian", "RedHat"]

- name: Disable Kernel IP Forwarding
  ansible.posix.sysctl:
    name: net.ipv4.ip_forward
    value: '0'
    state: present
    reload: true

- name: Disable Firewalld Masquerade (NAT)
  ansible.posix.firewalld:
    masquerade: false
    state: disabled
    permanent: true
    immediate: true
  when: ansible_os_family == "RedHat"

- name: Disable UFW NAT
  block:
    - name: Disable Forwarding
      ansible.builtin.lineinfile:
        path: /etc/default/ufw
        regexp: '^DEFAULT_FORWARD_POLICY='
        line: 'DEFAULT_FORWARD_POLICY="DROP"'

    - name: Remove NAT rules
      ansible.builtin.blockinfile:
        path: /etc/ufw/before.rules
        marker: "# {mark} ANSIBLE MANAGED NAT RULES"
        state: absent
      notify: Reload UFW
  when: ansible_os_family == "Debian"

- name: Remove temporary bootstrap IP
  ansible.builtin.command:
    cmd: "ip addr del {{ bootstrap_ip }}/{{ bootstrap_subnet }} dev {{ bootstrap_interface }}"
  register: del_ip
  failed_when:
    - del_ip.rc != 0
    - "'Cannot assign requested address' not in del_ip.stderr"
    - "'Error: ipv4: Address not found' not in del_ip.stderr"
  changed_when: del_ip.rc == 0
