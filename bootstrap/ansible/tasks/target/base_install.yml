---
- name: Gather user info (needed for systemd UIDs)
  ansible.builtin.getent:
    database: passwd

- name: Get current arch
  ansible.builtin.shell: "uname -m"
  register: arch
  changed_when: false

- name: Set facts for arch
  ansible.builtin.set_fact:
    current_arch: "{{ arch.stdout }}"

- name: Ensure major dependencies are installed (EPEL/config-manager)
  ansible.builtin.dnf:
    name:
      - epel-release
      - dnf-plugins-core
    state: present
    update_cache: true
  when:
    - ansible_os_family == "RedHat"
    - ansible_distribution != "Fedora"

- name: Check if CRB is already enabled
  ansible.builtin.shell: dnf repolist | grep -qi "^crb"
  register: crb_check
  failed_when: false
  changed_when: false

- name: Enable the CRB repository
  ansible.builtin.command: dnf config-manager --set-enabled crb
  register: crb_enable
  when: crb_check.rc != 0

- name: Enable Node.js 24 module stream
  ansible.builtin.dnf:
    name: "@nodejs:24"
    state: present

- name: Install base packages (Fedora/RedHat)
  ansible.builtin.dnf:
