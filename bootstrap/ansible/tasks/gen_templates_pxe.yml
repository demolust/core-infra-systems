---
- name: Generate dnsmasq configuration from template
  ansible.builtin.template:
    src: dnsmasq.conf.j2
    dest: "{{ base_dir }}/dnsmasq.conf"
    mode: '0644'

- name: Generate nginx configuration from template
  ansible.builtin.template:
    src: nginx.conf.j2
    dest: "{{ base_dir }}/nginx.conf"
    mode: '0644'

- name: Generate nginx configuration from template
  ansible.builtin.template:
    src: tftpd.map.j2
    dest: "{{ base_dir }}/tftpd.map"
    mode: '0644'

- name: Deploy GRUB config for Secure Boot
  ansible.builtin.template:
    src: grub.cfg.j2
    dest: "{{ base_dir }}/tftp/{{ selected_arch }}/grub.cfg"

- name: Deploy iPXE script for Non-SB
  ansible.builtin.template:
    src: boot.ipxe.j2
    dest: "{{ base_dir }}/www/{{ selected_arch }}/boot.ipxe"

- name: Deploy the kickstart script
  ansible.builtin.template:
    src: ks.cfg.j2
    dest: "{{ base_dir }}/www/{{ selected_arch }}/ks.cfg"
