---
- name: Set host variables for the rest of the run
  ansible.builtin.set_fact:
    bootstrap_services:
      - {port: '66', proto: 'udp'}
      - {name: 'dhcp', port: '67', proto: 'udp'}
      - {port: '68', proto: 'udp'}
      - {name: 'tftp', port: '69', proto: 'udp'}
      - {port: '4011', proto: 'udp'}
      - {name: 'http', port: '80', proto: 'tcp'}
      - {name: 'https', port: '443', proto: 'tcp'}

- name: Allow rootless user to bind to privileged ports
  ansible.posix.sysctl:
    name: net.ipv4.ip_unprivileged_port_start
    value: '0'
    state: present
    sysctl_set: true

- name: Ensure the default firewall is installed
  ansible.builtin.package:
    name: "{{ 'ufw' if ansible_os_family == 'Debian' else 'firewalld' }}"
    state: present

- name: Open ports on UFW
  community.general.ufw:
    rule: allow
    # Use name if it exists, otherwise use port
    name: "{{ item.name | default(omit) }}"
    port: "{{ item.port if item.name is not defined else omit }}"
    proto: "{{ item.proto }}"
  loop: "{{ bootstrap_services }}"
  when: ansible_os_family == "Debian"

- name: Open ports on firewalld
  ansible.posix.firewalld:
    # Firewalld prefers the 'service' parameter for names
    service: "{{ item.name | default(omit) }}"
    port: "{{ (item.port + '/' + item.proto) if item.name is not defined else omit }}"
    permanent: true
    state: enabled
    immediate: true
  loop: "{{ bootstrap_services }}"
  when: ansible_os_family == "RedHat"

- name: Open ports via iptables
  ansible.builtin.iptables:
    chain: INPUT
    protocol: "{{ item.proto }}"
    destination_port: "{{ item.port }}"
    jump: ACCEPT
    action: insert
  loop: "{{ bootstrap_services }}"
  when: ansible_os_family not in ["Debian", "RedHat"]

- name: Install ISO dependencies (Debian/Ubuntu)
  become: true
  ansible.builtin.apt:
    name:
      - p7zip-full
      - genisoimage
    state: present
    update_cache: true
  when: ansible_os_family == "Debian"

- name: Install ISO dependencies (Fedora/RedHat)
  become: true
  ansible.builtin.dnf:
    name:
      - p7zip
      - p7zip-plugins
      - genisoimage
    state: present
  when: ansible_os_family == "RedHat"

- name: Add temporary bootstrap IP
  ansible.builtin.command:
    cmd: "ip addr add {{ bootstrap_ip }}/{{ bootstrap_subnet}} dev {{ bootstrap_interface }}"
  register: add_ip
  failed_when:
    - add_ip.rc != 0
    - "'File exists' not in add_ip.stderr"
    - "'Error: ipv4: Address already assigned' not in add_ip.stderr"
  changed_when: add_ip.rc == 0
