---
- name: Deny unnecessary ports on public zone
  ansible.posix.firewalld:
    zone: public
    service: "{{ item.name | default(omit) }}"
    port: "{{ (item.port + '/' + item.proto) if item.name is not defined else omit }}"
    permanent: true
    state: disabled
    immediate: true
  loop:
    - { name: 'cockpit' }
  when: ansible_facts['os_family'] == "RedHat"

- name: Enable masquerading (NAT) on public zone
  ansible.posix.firewalld:
    zone: public
    masquerade: true
    permanent: true
    state: enabled
    immediate: true
  when: ansible_facts['os_family'] == "RedHat"

- name: Allow necessary ports on internal zone
  ansible.posix.firewalld:
    zone: internal
    service: "{{ item.name | default(omit) }}"
    port: "{{ (item.port + '/' + item.proto) if item.name is not defined else omit }}"
    permanent: true
    state: enabled
    immediate: true
  loop: "{{ net_services }}"
  when: ansible_facts['os_family'] == "RedHat"

- name: Copy firewalld policy file
  ansible.builtin.template:
    src: firewalld_int_to_ext.xml.j2
    dest: /etc/firewalld/policies/int_to_ext.xml
    owner: root
    group: root
    mode: '0644'
  notify: Reload firewalld
