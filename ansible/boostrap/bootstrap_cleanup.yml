---
- name: Cleanup of the PXE setup
  hosts: localhost
  connection: local
  gather_facts: true

  tasks:
    - name: Stop Podman Services
      block:
        - name: Elevate for 'Stop Podman Services'
          ansible.builtin.import_tasks: tasks/container_cln.yml
      become: true

    - name: Clean up Host Networking and Security
      block:
        - name: Elevate for 'Clean up Host Networking and Security'
          ansible.builtin.import_tasks: tasks/host_setup_cln.yml
      become: true

    - name: Cleanup Directory Structure
      ansible.builtin.import_tasks: tasks/dir_structure_cln.yml
