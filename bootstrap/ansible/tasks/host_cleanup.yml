---
- name: Set host variables for the rest of the run
  ansible.builtin.set_fact:
    bootstrap_services:
      - {port: '66', proto: 'udp'}
      - {name: 'dhcp', port: '67', proto: 'udp'}
      - {port: '68', proto: 'udp'}
      - {name: 'tftp', port: '69', proto: 'udp'}
      - {port: '4011', proto: 'udp'}
      - {name: 'http', port: '80', proto: 'tcp'}
      - {name: 'https', port: '443', proto: 'tcp'}

- name: Allow rootless user to bind to privileged ports
  ansible.posix.sysctl:
    name: net.ipv4.ip_unprivileged_port_start
    value: '1024'
    state: present
    sysctl_set: true

- name: Close ports on UFW
  community.general.ufw:
    rule: delete
    # Use name if it exists, otherwise use port
    name: "{{ item.name | default(omit) }}"
    port: "{{ item.port if item.name is not defined else omit }}"
    proto: "{{ item.proto }}"
  loop: "{{ bootstrap_services }}"
  when: ansible_os_family == "Debian"

- name: Close ports on firewalld
  ansible.posix.firewalld:
    # Firewalld prefers the 'service' parameter for names
    service: "{{ item.name | default(omit) }}"
    port: "{{ (item.port + '/' + item.proto) if item.name is not defined else omit }}"
    permanent: true
    state: disabled
    immediate: true
  loop: "{{ bootstrap_services }}"
  when: ansible_os_family == "RedHat"

- name: Close ports via iptables
  ansible.builtin.iptables:
    chain: INPUT
    protocol: "{{ item.proto }}"
    destination_port: "{{ item.port }}"
    jump: ACCEPT
    action: remove
  loop: "{{ bootstrap_services }}"
  when: ansible_os_family not in ["Debian", "RedHat"]

- name: Remove temporary bootstrap IP
  ansible.builtin.command:
    cmd: "ip addr del {{ bootstrap_ip }}/{{ bootstrap_subnet }} dev {{ bootstrap_interface }}"
  register: del_ip
  failed_when:
    - del_ip.rc != 0
    - "'Cannot assign requested address' not in del_ip.stderr"
    - "'Error: ipv4: Address not found' not in del_ip.stderr"
  changed_when: del_ip.rc == 0
