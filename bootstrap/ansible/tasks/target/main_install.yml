---
- name: Get Network Subnet and Mask
  shell: "ip route show dev {{ pxe_interface }} | grep 'proto kernel' | awk '{print $1}'"
  register: network_info
  changed_when: false

- name: Get Network IP
  shell: "ip -o -4 addr show {{ pxe_interface }} | awk '{print $4}'"
  register: ip_info
  changed_when: false

- name: Set facts for subnet and mask
  set_fact:
    remote_subnet: "{{ network_info.stdout.split('/')[0] }}"
    remote_netmask: "{{ network_info.stdout.split('/')[1] }}"
    remote_server_ip: "{{ ip_info.stdout.split('/')[0] }}"

- name: Install Samba packages (Fedora/RedHat)
  ansible.builtin.dnf:
    name:
      - samba
      - samba-client
      - samba-common
    state: present
    update_cache: true
  when: ansible_os_family == "RedHat"

- name: Allow Samba service via firewalld
  ansible.posix.firewalld:
    service: samba
    permanent: true
    state: enabled
    immediate: true
  when: ansible_os_family == "RedHat"

- name: Generate smb configuration from template
  ansible.builtin.template:
    src: target/smb.conf.j2
    dest: "/etc/samba/smb.conf"
    mode: '0644'

#- name: Inject NTLM hash for Samba user
#  ansible.builtin.shell: |
#    pdbedit -a -u {{ item.name }} --set-nt-hash {{ item.password }}
#  loop: "{{ samba_users }}"
#  no_log: true
#  register: pdb_result
#  changed_when: "'User added' in pdb_result.stdout"

- name: Set Samba password
  ansible.builtin.shell: |
    (echo "{{ item.password }}"; echo "{{ item.password }}") | smbpasswd -s -a {{ item.name }}
  loop: "{{ samba_users }}"
  no_log: true
  register: smb_result
  changed_when: "'Added user' in smb_result.stdout"

- name: Apply SELinux file context for Samba shares
  community.general.sefcontext:
    target: "{{ item.path }}(/.*)?"
    setype: samba_share_t
    state: present
  loop: "{{ samba_custom_shares }}"
  register: selinux_context
  notify: "Run restorecon"
  when: ansible_os_family == "RedHat"

- name: "Run restorecon"
  command: "restorecon -Rv {{ item.path }}"
  loop: "{{ samba_custom_shares }}"

- name: Start and enable Samba services
  service:
    name: "{{ item }}"
    state: started
    enabled: true
  loop:
    - smb
    - nmb
  when: ansible_os_family == "RedHat"

- name: Enable podman-auto-update timer
  systemd:
    name: podman-auto-update.timer
    state: started
    enabled: true

- name: Allow Navidrome port via firewalld
  ansible.posix.firewalld:
    port: "{{ navidrome_port }}/tcp"
    permanent: true
    state: enabled
    immediate: true
  when: ansible_os_family == "RedHat"

- name: Allow Unifi Controller ports via firewalld
  firewalld:
    port: "{{ item.host }}/{{ item.proto }}"
    permanent: true
    state: enabled
    immediate: true
  loop: "{{ unifi_ports }}"

- name: Allow PXE ports via firewalld
  ansible.posix.firewalld:
    service: "{{ item.name | default(omit) }}"
    port: "{{ (item.port + '/' + item.proto) if item.name is not defined else omit }}"
    permanent: true
    state: enabled
    immediate: true
  loop: "{{ pxe_services }}"
  when: ansible_os_family == "RedHat"

- name: Create PXE directory structure
  ansible.builtin.file:
    path: "{{ pxe_base_dir }}/{{ item }}"
    state: directory
    mode: '2775'
    owner: "root"
    group: "wheel"
  loop:
    - "."
    - "configs"
    - "isos"
    - "images"
    - "tftp/x86_64/rescue"
    - "tftp/aarch64/rescue"
    - "www/ipxe/configs"
    - "www/x86_64/rescue"
    - "www/aarch64/rescue"

- name: Deploy PXE configuration files
  ansible.builtin.template:
    src: "target/{{ item.src }}"
    dest: "{{ item.dest }}"
    mode: "{{ item.mode | default('0664') }}"
    owner: "root"
    group: "wheel"
  loop:
    - { src: 'dnsmasq.conf.j2', dest: "{{ pxe_base_dir }}/configs/dnsmasq.conf" }
    - { src: 'nginx.conf.j2',   dest: "{{ pxe_base_dir }}/configs/nginx.conf" }
    - { src: 'tftpd.map.j2',    dest: "{{ pxe_base_dir }}/configs/tftpd.map" }
    - { src: 'grub.cfg.j2',     dest: "{{ pxe_base_dir }}/tftp/grub.cfg" }
    - { src: 'boot.ipxe.j2',    dest: "{{ pxe_base_dir }}/www/ipxe/configs/boot.ipxe" }
  register: config_results

- name: Ensure root systemd contianer directory exists
  file:
    path: "/etc/containers/systemd"
    state: directory
    mode: '0755'

- name: Deploy root Quadlet files
  template:
    src: "target/{{ item.src }}"
    dest: "/etc/containers/systemd/{{ item.dest }}"
  loop:
    - { src: 'pxe.pod.j2', dest: 'pxe.pod' }
    - { src: 'pxe_dnsmasq.container.j2', dest: 'pxe_dnsmasq.container' }
    - { src: 'pxe_tftp.container.j2', dest: 'pxe_tftp.container' }
    - { src: 'pxe_nginx.container.j2', dest: 'pxe_nginx.container' }
  register: quadlet_results

- name: Reload systemd to generate service from Quadlet
  systemd:
    daemon_reload: true
  when: quadlet_results.changed

- name: Start pxe pod
  systemd:
    name: pxe-pod.service
    state: restarted
    enabled: true
  when: quadlet_results.changed or config_results.changed
