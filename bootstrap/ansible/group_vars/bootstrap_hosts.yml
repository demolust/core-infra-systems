---
# General
admin_home_dir: "/home/{{ admin_username }}"

# Samba
admin_samba_password: "{{ lookup('env', 'TARGET_ADMIN_SAMBA_PASSWORD') | default('', true) }}"
admin_samba_password_hash: "{{ lookup('env', 'TARGET_ADMIN_SAMBA_PASSWORD_HASH') | default('', true) }}"
samba_workgroup: "WORKGROUP"
samba_users_path: "/home"
samba_spool_path: "/var/spool/samba"
samba_share_group: "share"
samba_users:
  - { name: "{{ admin_username }}", password: "{{ admin_samba_password }}" }
  # - { name: "{{ admin_username }}", password: "{{ vault_admin_samba_hashed_pass }}" }
  # - { name: "{{ admin_username }}", password: "{{ vault_admin_samba_pass }}" }
samba_custom_shares:
  - name: "data"
    comment: "Restricted Data Share (Linux-style case sensitivity | Permissions: 664/775) For {{ admin_username }} and @{{ samba_share_group }}"
    path: "/data"
    write_list: "{{ admin_username }} @{{ samba_share_group }}"
    force_group: "{{ samba_share_group }}"
    guest_ok: "No"
    case_sensitive: "True"
    default_case: "lower"
    preserve_case: "yes"
    short_preserve_case: "yes"

# dotfiles repo
github_user: "{{ lookup('env', 'GITHUB_USERNAME') | default('', true) }}"
github_repo: "{{ lookup('env', 'GITHUB_REPO') | default('', true) }}"
dotfiles_repo: "https://github.com/{{ github_user }}/{{ github_repo }}.git"

# navidrome data
navidrome_data_dir: "/data/srv/navidrome"
navidrome_music_dir: "/data/Music"
navidrome_port: "4533"

# PXE data
pxe_http_port: "80"
pxe_interface: "{{ lookup('env', 'TARGET_PXE_INT') | default('enp0s31f6', true) }}"
pxe_base_dir: "/data/srv/pxe"

# UNIFI Controller data
unifi_init_dir: "/data/srv/unifi/init"
unifi_db_data_dir: "/data/srv/unifi/db"
unifi_app_data_dir: "/data/srv/unifi/config"
unifi_env_dir: "/data/srv/unifi/env"
unifi_env_file: "{{ unifi_env_dir }}/unifi.env"
unifi_ports:
  - { host: 8443, container: 8443, proto: tcp }
  - { host: 8080, container: 8080, proto: tcp }
  - { host: 3478, container: 3478, proto: udp }
  - { host: 10001, container: 10001, proto: udp }
unifi_mongo_host: "{{ lookup('env', 'UNIFI_MONGO_HOST') | default('', true) }}"
unifi_mongo_port: "{{ lookup('env', 'UNIFI_MONGO_PORT') | default('', true) }}"
unifi_mongo_root_user: "{{ lookup('env', 'UNIFI_MONGO_ROOT_USER') | default('', true) }}"
unifi_mongo_root_pass: "{{ lookup('env', 'UNIFI_MONGO_ROOT_PASS') | default('', true) }}"
unifi_mongo_user: "{{ lookup('env', 'UNIFI_MONGO_USER') | default('', true) }}"
unifi_mongo_pass: "{{ lookup('env', 'UNIFI_MONGO_PASS') | default('', true) }}"
unifi_mongo_db_name: "{{ lookup('env', 'UNIFI_MONGO_DB_NAME') | default('', true) }}"
