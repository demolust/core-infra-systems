---
- name: Gather user information for systemd UIDs
  ansible.builtin.getent:
    database: passwd

- name: "Deploy {{ app.name }} configuration files"
  ansible.builtin.template:
    src: "{{ item.src }}"
    dest: "{{ item.dest }}"
    owner: "{{ app.user }}"
    group: "{{ app.group }}"
    mode: "{{ item.mode | default('0644') }}"
  loop: "{{ app.configs | default([]) }}"
  loop_control:
    label: "{{ item.src }}"
  register: configs

- name: "Deploy {{ app.name }} Quadlet files"
  ansible.builtin.template:
    src: "{{ item.src }}"
    dest: "/var/lib/{{ app.user }}/.config/containers/systemd/{{ item.dest }}"
    owner: "{{ app.user }}"
    group: "{{ app.group }}"
    mode: '0644'
  loop: "{{ app.templates }}"
  register: quadlets

- name: Reload systemd to generate service from Quadlet
  become_user: "{{ app.user }}"
  environment:
    XDG_RUNTIME_DIR: "/run/user/{{ ansible_facts.getent_passwd[app.user][1] }}"
  ansible.builtin.systemd:
    daemon_reload: true
    scope: user
  when: quadlets.changed

- name: "Ensure {{ app.name }} service is running"
  become_user: "{{ app.user }}"
  environment:
    XDG_RUNTIME_DIR: "/run/user/{{ ansible_facts.getent_passwd[app.user][1] }}"
  ansible.builtin.systemd:
    name: "{{ app.service }}"
    state: "{{ 'restarted' if (quadlets.changed or configs.changed) else 'started' }}"
    enabled: true
    scope: user

- name: Enable podman-auto-update timer
  become_user: "{{ app.user }}"
  environment:
    XDG_RUNTIME_DIR: "/run/user/{{ ansible_facts.getent_passwd[app.user][1] }}"
  ansible.builtin.systemd:
    name: "podman-auto-update.timer"
    state: started
    enabled: true
    scope: user
