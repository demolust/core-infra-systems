---
- name: Install Samba packages (Fedora/RedHat)
  ansible.builtin.dnf:
    name:
      - samba
      - samba-client
      - samba-common
    state: present
    update_cache: true
  when: ansible_facts['os_family'] == "RedHat"

- name: Generate Samba configuration from template
  ansible.builtin.template:
    src: smb.conf.j2
    dest: "/etc/samba/smb.conf"
    mode: '0644'

#- name: Inject NTLM hash for Samba user
#  ansible.builtin.shell: |
#    pdbedit -a -u {{ item.name }} --set-nt-hash {{ item.password }}
#  loop: "{{ samba_users }}"
#  no_log: true
#  register: pdb_result
#  changed_when: "'User added' in pdb_result.stdout"

- name: Set Samba password
  ansible.builtin.shell: |
    (echo "{{ item.password }}"; echo "{{ item.password }}") | smbpasswd -s -a {{ item.name }}
  loop: "{{ samba_users }}"
  no_log: true
  register: smb_result
  changed_when: "'Added user' in smb_result.stdout"

- name: Start and enable Samba services
  ansible.builtin.systemd:
    name: "{{ item }}"
    state: started
    enabled: true
  loop:
    - smb
    - nmb
  when: ansible_facts['os_family'] == "RedHat"

