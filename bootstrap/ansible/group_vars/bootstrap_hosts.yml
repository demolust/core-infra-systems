---
# General
admin_home_dir: "/home/{{ admin_username }}"

system_groups:
  share: "share"
  gitops: "gitops"
  unifi: "unifi"
  navidrome: "navidrome"
  runner: "runner"
  vault: "vault"
  netbox: "netbox"
system_users:
  runner:
    name: "runner"
    shell: "/usr/sbin/nologin"
    group: "{{ system_groups.runner }}"
    groups: "{{ system_groups.gitops }},systemd-journal"
  unifi:
    name: "unifi"
    shell: "/usr/sbin/nologin"
    group: "{{ system_groups.unifi }}"
    groups: "systemd-journal"
  navidrome:
    name: "navidrome"
    shell: "/usr/sbin/nologin"
    group: "{{ system_groups.navidrome }}"
    groups: "{{ system_groups.share }},systemd-journal"
  vault:
    name: "vault"
    shell: "/usr/sbin/nologin"
    group: "{{ system_groups.vault }}"
    groups: "systemd-journal"
  netbox:
    name: "netbox"
    shell: "/usr/sbin/nologin"
    group: "{{ system_groups.netbox }}"
    groups: "systemd-journal"

data_basedir: "/data"
samba_data_share_dir: "{{ data_basedir }}/share"
navidrome_data_dir: "{{ data_basedir }}/srv/navidrome"
pxe_base_dir: "{{ data_basedir }}/srv/pxe"
unifi_base_dir: "{{ data_basedir }}/srv/unifi"
unifi_paths:
  base: "{{ unifi_base_dir }}"
  init: "{{ unifi_base_dir }}/init"
  db: "{{ unifi_base_dir }}/db"
  config: "{{ unifi_base_dir }}/config"
  env: "{{ unifi_base_dir }}/env"
vault_base_dir: "{{ data_basedir }}/srv/vault"
vault_paths:
  config: "{{ vault_base_dir }}/config"
  data: "{{ vault_base_dir }}/data"
  env: "{{ vault_base_dir }}/env"
netbox_base_dir: "{{ data_basedir }}/srv/netbox"
netbox_paths:
  data: "{{ netbox_base_dir }}/data"
  db: "{{ netbox_base_dir }}/db"
  env: "{{ netbox_base_dir }}/env"
gitops_base_dir: "{{ data_basedir }}/sys"
ansible_cache_dir: "{{ gitops_base_dir }}/ansible"
terraform_cache_dir: "{{ gitops_base_dir }}/terraform"
iac_repo_base_dir: "{{ gitops_base_dir }}/repo"
navidrome_music_dir: "{{ samba_data_share_dir }}/general/Music"
samba_internal_dir: "/share"
samba_cont_dir: "{{ data_basedir }}/srv/samba"
samba_conf_dir: "{{ samba_cont_dir }}/config"
samba_priv_dir: "{{ samba_cont_dir }}/private"

data_directories:
  # Base dir
  - paths:
      - "{{ data_basedir }}"
    owner: "root"
    group: "root"
    mode: '0755'

  # GitOps & Cache
  - paths:
      - "{{ gitops_base_dir }}"
      - "{{ ansible_cache_dir }}"
      - "{{ terraform_cache_dir }}"
      - "{{ iac_repo_base_dir }}"
    owner: "root"
    group: "{{ system_groups.gitops }}"
    mode: '2775'
    setype: public_content_rw_t

  # Media
  - paths: ["{{ samba_data_share_dir }}"]
    owner: "root"
    group: "{{ system_groups.share }}"
    mode: '2775'

    # Paths to specific shares in samba_custom_shares
  - paths:
      - "{{ samba_data_share_dir }}/general"
      - "{{ navidrome_music_dir }}"
    owner: "{{ admin_username }}"
    group: "{{ system_groups.share }}"
    state: directory
    mode: '2775'

  # Universal Services Parent
  - paths: ["{{ data_basedir }}/srv"]
    owner: "root"
    group: "root"
    mode: '0755'

  # Navidrome
  - paths: ["{{ navidrome_data_dir }}"]
    owner: "{{ system_users.navidrome.name }}"
    group: "{{ system_groups.navidrome }}"
    mode: '0775'

  # Unifi (Grabs all paths from the dict automatically)
  - paths: "{{ unifi_paths.values() | list }}"
    owner: "{{ system_users.unifi.name }}"
    group: "{{ system_groups.unifi }}"
    mode: '0755'

  # Vault
  - paths: "{{ vault_paths.values() | list }}"
    owner: "{{ system_users.vault.name }}"
    group: "{{ system_groups.vault }}"
    mode: '0755'

  # NetBox
  - paths: "{{ netbox_paths.values() | list }}"
    owner: "{{ system_users.netbox.name }}"
    group: "{{ system_groups.netbox }}"
    mode: '0755'

  # Samba
  - paths:
      - "{{ samba_cont_dir }}"
      - "{{ samba_conf_dir }}"
      - "{{ samba_priv_dir }}"
    owner: "root"
    group: "wheel"
    mode: '0755'

# Gitops tooling
gitops_tooling:
  repo_path: "{{ iac_repo_base_dir }}"
  ansible:
    cache_path: "{{ ansible_cache_dir }}"
    version: "2.18.6"
    image: "docker.io/alpine/ansible"
  terraform:
    cache_path: "{{ terraform_cache_dir }}"
    version: "1.14.9"
    image: "docker.io/hashicorp/terraform"

# Samba
admin_samba_password: "{{ lookup('env', 'TARGET_ADMIN_SAMBA_PASSWORD') | default('', true) }}"
admin_samba_password_hash: "{{ lookup('env', 'TARGET_ADMIN_SAMBA_PASSWORD_HASH') | default('', true) }}"
samba_workgroup: "WORKGROUP"
samba_users_path: "/home"
samba_spool_path: "/var/spool/samba"
samba_users:
  - { name: "{{ admin_username }}", password: "{{ admin_samba_password }}" }
  # - { name: "{{ admin_username }}", password: "{{ vaulted_admin_samba_hashed_pass }}" }
  # - { name: "{{ admin_username }}", password: "{{ vaulted_admin_samba_pass }}" }
samba_custom_shares:
  - name: "data"
    comment: "Restricted Data Share (Linux-style case sensitivity | Permissions: 664/775) For {{ admin_username }} and @{{ system_groups.share }}"
    path: "{{ samba_internal_dir }}/general"
    write_list: "{{ admin_username }} @{{ system_groups.share }}"
    force_group: "{{ system_groups.share }}"
    guest_ok: "No"
    case_sensitive: "True"
    default_case: "lower"
    preserve_case: "yes"
    short_preserve_case: "yes"

# dotfiles repo
github_user: "{{ lookup('env', 'GITHUB_USERNAME') | default('', true) }}"
github_repo: "{{ lookup('env', 'GITHUB_REPO') | default('', true) }}"
dotfiles_repo: "https://github.com/{{ github_user }}/{{ github_repo }}.git"

# navidrome data
navidrome_port: "4533"

# PXE data
pxe_http_port: "80"
pxe_interface: "{{ lookup('env', 'TARGET_PXE_INT') | default('enp0s31f6', true) }}"

# UNIFI Controller data
unifi_env_file: "{{ unifi_paths.env }}/env"
unifi_ports:
  - { host: 8443, container: 8443, proto: tcp }
  - { host: 8080, container: 8080, proto: tcp }
  - { host: 3478, container: 3478, proto: udp }
  - { host: 10001, container: 10001, proto: udp }
unifi_mongo_root_pass: "{{ lookup('env', 'UNIFI_MONGO_ROOT_PASS') | default('', true) }}"
unifi_mongo_pass: "{{ lookup('env', 'UNIFI_MONGO_PASS') | default('', true) }}"

# Vault data
vault_port: "8200"
vault_init_file: "{{ vault_paths.config }}/vault.hcl"
vault_internal_data: "/vault/data"
vault_internal_config: "/openbao/config"
vault_env_file: "{{ vault_paths.env }}/env"

# NetBox data
netbox_port: "9090"
netbox_env_file: "{{ netbox_paths.env }}/env"
netbox_postgres_pass: "{{ lookup('env', 'NETBOX_POSTGRES_PASS') | default('', true) }}"
netbox_secret_key: "{{ lookup('env', 'NETBOX_SECRET_KEY') | default('', true) }}"
netbox_allowed_hosts: "{{ lookup('env', 'NETBOX_ALLOWED_HOSTS') | default('*', true) }}"
netbox_superuser_name: "{{ lookup('env', 'NETBOX_SUPERUSER_NAME') | default('admin', true) }}"
netbox_superuser_email: "{{ lookup('env', 'NETBOX_SUPERUSER_EMAIL') | default('', true) }}"
netbox_superuser_pass: "{{ lookup('env', 'NETBOX_SUPERUSER_PASS') | default('', true) }}"

# Quadlets apps data
quadlet_services:
  - name: navidrome
    user: "{{ system_users.navidrome.name }}"
    group: "{{ system_groups.share }}"
    service: "navidrome"
    templates:
      - { src: "navidrome.container.j2", dest: "navidrome.container" }
  - name: unifi
    user: "{{ system_users.unifi.name }}"
    group: "{{ system_groups.unifi }}"
    service: "unifi-controller-pod"
    templates:
      - { src: "unifi-controller.pod.j2", dest: "unifi-controller.pod" }
      - { src: "unifi-db.container.j2", dest: "unifi-db.container" }
      - { src: "unifi-application.container.j2", dest: "unifi-application.container" }
  - name: "vault"
    user: "{{ system_users.vault.name }}"
    group: "{{ system_groups.vault }}"
    service: "vault"
    templates:
      - { src: "vault.container.j2", dest: "vault.container" }
  - name: "netbox"
    user: "{{ system_users.netbox.name }}"
    group: "{{ system_groups.netbox }}"
    service: "netbox-pod"
    templates:
      - { src: "netbox.pod.j2", dest: "netbox.pod" }
      - { src: "netbox-db.container.j2", dest: "netbox-db.container" }
      - { src: "netbox-app.container.j2", dest: "netbox-app.container" }
      - { src: "netbox-redis.container.j2", dest: "netbox-redis.container" }
      - { src: "netbox-worker.container.j2", dest: "netbox-worker.container" }
